[project]
name = "jsonpatchkit"
dynamic = ["version"]
description = "Granular, schema-safe JSON editing for LLM tool calling: patch existing documents instead of regenerating them."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    {name = "Noah Scharrenberg", email = "nscharrenberg+github@proton.me" }
]
keywords = ["llm", "json-patch", "pydantic", "structured-output", "tool-calling", "langchain", "langgraph"]
dependencies = [
    "pydantic>=2.13.4,<3.0",
]

[project.optional-dependencies]
langchain = ["langchain-core>=1.5.3,<2.0"]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0",
    "ruff>=0.16.1",
    "mypy>=2.3.0",
    "langchain-core>=1.5.3,<2.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/jsonpatchkit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jsonpatchkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pycodestyle, pyflakes, isort, pyupgrade, bugbear
ignore = ["UP045", "UP007"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/jsonpatchkit"]
