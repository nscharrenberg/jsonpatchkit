name: CI

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least-privilege default: no job here needs to write to the repo. Jobs
# that need more (none currently) should declare it explicitly at the
# job level rather than raising this baseline.
permissions:
  contents: read

# Cancel superseded runs on the same branch/PR so pushes to a fast-moving
# PR don't queue up redundant CI runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs (dynamic versioning) needs full history to find
          # tags — a shallow checkout can't compute a version, and
          # `pip install -e .` below runs the build backend, which needs one.
          fetch-depth: 0
          # Nothing in this job pushes back to the repo; don't leave a
          # git credential sitting around for the `pip install` step
          # (which runs arbitrary third-party setup/build code) to find.
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # pytest/ruff/mypy live in [dependency-groups] (PEP 735), not
      # [project.optional-dependencies] — `.[dev]` would silently
      # install nothing for them. `--group` needs pip>=25.1.
      - name: Install project (dev dependency group)
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project (dev dependency group)
        run: |
          python -m pip install --upgrade pip
          pip install -e . --group dev

      - name: Run tests
        run: pytest --cov=jsonpatchkit --cov-report=xml --cov-report=term-missing

      # Coverage numbers can differ trivially by platform/Python version
      # (e.g. formatting-only branches); one representative combo is
      # enough to publish as an artifact rather than uploading 12 copies.
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  build-check:
    name: Verify package builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check dist/*

      - name: Upload built distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/